<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#080711"/>
    </linearGradient>
    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield/Circle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#3b82f6" stroke-width="8" stroke-opacity="0.3"/>

  <!-- Logo Graphics: Hanger + Letter D -->
  <g transform="translate(128, 128)" filter="url(#glow)">
    <!-- Hanger hook -->
    <path d="M128 32 C128 -8, 176 -8, 176 24 C176 40, 160 48, 144 56 L128 64" fill="none" stroke="url(#accentGrad)" stroke-width="20" stroke-linecap="round"/>
    
    <!-- Hanger shoulder structure -->
    <path d="M16 144 L112 80 C120 75, 136 75, 144 80 L240 144" fill="none" stroke="url(#accentGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Bold 'D' inside -->
    <path d="M80 112 L80 208 C80 208, 160 208, 160 160 C160 112, 80 112, 80 112 Z" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>